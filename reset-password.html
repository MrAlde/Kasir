<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reset Password — Kasir Toko</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#111b32;background:#101729}
*{box-sizing:border-box}
body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:20px}
main{background:white;border-radius:24px;padding:30px;width:min(100%,420px);box-shadow:0 20px 60px #0004}
.logo{display:inline-grid;place-items:center;background:#2962ee;color:white;font-weight:800;border-radius:15px;width:60px;height:60px;font-size:19px}
h1{font-size:1.55rem;margin:18px 0 6px}p{line-height:1.5;color:#51617a;margin:0 0 18px}
label{display:block;margin:16px 0 7px;font-size:.9rem;font-weight:600}
input,button{width:100%;padding:13px 14px;border-radius:11px;font:inherit}
input{border:1px solid #d3dcea;outline-offset:2px}
button{border:0;background:#2962ee;color:white;font-weight:700;cursor:pointer;margin-top:20px}
button:disabled{opacity:.65;cursor:wait}
a{color:#235ad9}
.status{font-size:.94rem;margin-top:14px;overflow-wrap:anywhere}
.status.error{color:#b42318}.status.ok{color:#087443}
.hidden{display:none!important}
.back{display:inline-block;margin-top:20px;text-decoration:none;font-size:.94rem}
</style>
</head>
<body>
<main>
  <div class="logo">POS</div>
  <h1>Atur Ulang Password</h1>
  <p id="intro">Memeriksa tautan pemulihan akun kasir...</p>
  <form id="resetForm" class="hidden">
    <label for="newPassword">Password baru</label>
    <input id="newPassword" type="password" autocomplete="new-password" required minlength="12" placeholder="Minimal 12 karakter">
    <label for="confirmPassword">Ulangi password baru</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" required minlength="12" placeholder="Masukkan lagi password baru">
    <button id="saveButton" type="submit">Simpan password baru</button>
  </form>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <a class="back" href="./">Kembali ke halaman login</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
  const status = document.getElementById('status');
  const intro = document.getElementById('intro');
  const form = document.getElementById('resetForm');
  const button = document.getElementById('saveButton');
  function message(value, kind='error'){ status.textContent=value; status.className='status '+kind; }
  const params = new URLSearchParams(location.hash.replace(/^#/, ''));
  if(params.has('error') || params.has('error_code')){
    intro.textContent='Tautan pemulihan tidak berlaku.';
    message('Tautan mungkin sudah kedaluwarsa atau pernah digunakan. Minta email reset password baru.');
    return;
  }
  if(!window.supabase){
    intro.textContent='Tidak bisa memuat layanan login.';
    message('Periksa koneksi internet lalu buka halaman ini kembali lewat Safari atau Chrome.');
    return;
  }
  const db=window.supabase.createClient(
    'https://hbewkflvocskgiypgjft.supabase.co',
    'sb_publishable_6oQ0xG2TskM37fjf3mv_7A_9WX2dG-X'
  );
  function showForm(){
    intro.textContent='Masukkan password baru untuk akun kasir. Gunakan minimal 12 karakter.';
    form.classList.remove('hidden');
    message('', 'ok');
  }
  db.auth.onAuthStateChange((event, session)=>{
    if(event==='PASSWORD_RECOVERY' && session?.user) showForm();
  });
  try{
    const {data, error}=await db.auth.getSession();
    if(error) throw error;
    if(data?.session?.user) {
      showForm();
    } else {
      intro.textContent='Tautan pemulihan belum dapat diverifikasi.';
      message('Buka tautan langsung dari email terbaru. Jika masih gagal, minta email reset yang baru dari Supabase.');
    }
  }catch(e){
    intro.textContent='Gagal memeriksa tautan pemulihan.';
    message('Periksa koneksi internet, lalu coba lagi. '+(e?.message||''));
  }
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    const password=document.getElementById('newPassword').value;
    const confirm=document.getElementById('confirmPassword').value;
    if(password.length<12){message('Password harus minimal 12 karakter.');return;}
    if(password!==confirm){message('Kedua password tidak sama.');return;}
    button.disabled=true;button.textContent='Menyimpan...';message('');
    try{
      const {error}=await db.auth.updateUser({password});
      if(error) throw error;
      form.classList.add('hidden');
      intro.textContent='Password berhasil diubah.';
      message('Sekarang kembali ke halaman kasir dan login dengan nama kasir serta password baru.', 'ok');
      await db.auth.signOut();
    }catch(err){message('Gagal mengubah password: '+(err?.message||'coba lagi.'));}
    finally{button.disabled=false;button.textContent='Simpan password baru';}
  });
})();
</script>
</body>
</html>
